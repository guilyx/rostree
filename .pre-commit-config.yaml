# See https://pre-commit.com for usage
# Install: pip install -e ".[dev]" && pre-commit install && pre-commit install --hook-type commit-msg

default_language_version:
  python: python3

repos:
  # Conventional commit message (fix:, feat:, chore:, etc.)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.1.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, style, refactor, test, ci, perf, build, revert, deps]

  # Ruff, black and bandit run from the environment, not from pre-commit's own
  # copies: the versions are pinned once, in the `dev` extra of pyproject.toml,
  # and CI installs the same extra. A separate `rev:` here drifted before —
  # pre-commit ran ruff 0.8 while CI ran 0.16 — so a commit that passed locally
  # could still fail CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests|examples|scripts)/

      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        files: ^(src|tests|examples|scripts)/

      # The same security scan Codacy runs on pull requests. tests/ is excluded
      # from this tool (see .codacy.yaml for why); pre-commit passes files
      # explicitly, which would bypass [tool.bandit]'s exclude_dirs.
      - id: bandit
        name: bandit
        entry: bandit -c pyproject.toml
        language: system
        types: [python]
        files: ^(src|examples|scripts)/
