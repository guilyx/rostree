# The release workflow (publish.yml) decides the next version from the titles of
# the pull requests merged since the last release. A title that is not a
# Conventional Commit releases nothing and is left out of the changelog, so it is
# checked here, where it is still easy to fix.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        # Passed through the environment, never interpolated into the script: a
        # title is text anyone opening a pull request controls.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|deps|docs|refactor|test|build|ci|chore|style)(\([A-Za-z0-9._/-]+\))?!?: [^ ].*'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
            exit 0
          fi
          {
            echo "::error title=PR title is not a Conventional Commit::Got: $TITLE"
            echo "Expected: <type>[(scope)][!]: <summary>, e.g. 'fix(cli): honour --no-color after the subcommand'."
            echo "Types: feat fix perf revert deps docs refactor test build ci chore style."
            echo "feat bumps the minor version, fix/perf/revert/deps the patch version, '!' the major."
          } >&2
          exit 1
