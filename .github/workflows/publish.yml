# Release rostree: version, tag, PyPI, GitHub release, docs.
#
# A release starts in one of three ways:
# - a pull request is merged into main: the titles of the pull requests merged since
#   the last v* tag decide the bump (Conventional Commits: `feat!:` or a
#   `BREAKING CHANGE:` footer is major, `feat:` minor, `fix:`/`perf:`/`revert:`/`deps:`
#   patch; `docs:`, `chore:`, `ci:` and the rest release nothing on their own). The
#   version is bumped, [Unreleased] in CHANGELOG.md becomes the new entry, and the
#   result is committed to main and tagged;
# - a v* tag is pushed by hand: that tag is released as it is;
# - this workflow is run by hand from the Actions tab, with the part to bump.
#
# Nothing here opens a pull request or waits for an approval. The release commit and
# tag are pushed with the workflow token, which starts no other workflow, so this file
# builds, publishes and redeploys the docs itself.
#
# PyPI trusts this file by name for trusted publishing (pypi.org → rostree →
# Publishing: workflow `publish.yml`, environment `pypi`), which is why the whole
# release lives here rather than in a file called release.yml.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump ("auto" reads the merged pull requests)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# One release at a time, and never cancel one half-way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide, bump and tag
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and the tag
      pull-requests: read # read the titles of the merged pull requests
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect what was merged since the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          echo "last release: ${last:-none}"
          : > changes.jsonl
          for sha in $(git log --format=%H "${last:+${last}..}HEAD"); do
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | .[0] | if . == null then null else {number, title} end' \
              2>/dev/null || true)"
            jq -nc \
              --arg sha "$sha" \
              --arg subject "$(git log -1 --format=%s "$sha")" \
              --arg body "$(git log -1 --format=%b "$sha")" \
              --argjson pr "${pr:-null}" \
              '{sha: $sha, subject: $subject, body: $body, pr: $pr}' >> changes.jsonl
          done
          jq -r '"\(.sha[0:7])  #\(.pr.number // "-")  \(.pr.title // .subject)"' changes.jsonl

      - name: Bump, commit and tag
        id: cut
        env:
          PART: ${{ inputs.bump || 'auto' }}
        run: |
          part="$(python3 scripts/release/release.py plan changes.jsonl --part "$PART")"
          if [ -z "$part" ]; then
            echo "Nothing merged since the last release calls for one."
            exit 0
          fi
          version="$(python3 scripts/release/release.py apply changes.jsonl --part "$part")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): v${version}"
          git tag -a "v${version}" -m "rostree ${version}"
          git push origin HEAD:main "v${version}"
          echo "Released ${part}: v${version}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.version.outputs.tag != '') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
        run: echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag matches the package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != v${version}"; exit 1; }

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Smoke-test the wheel
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/rostree --version | tee /dev/stderr | grep -qx "rostree ${TAG#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: no token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned to a commit (v1.14.3): this job can publish to PyPI.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github:
    name: Publish the GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          python3 scripts/release/release.py notes "$version" > notes.md
          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo "pip install rostree==${version}"
            echo '```'
            echo
            echo "On PyPI: https://pypi.org/project/rostree/${version}/"
          } >> notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi

  docs:
    name: Redeploy the docs
    needs: [build, github]
    # Pages deploys from main; a release from a hand-pushed tag waits for the next
    # docs change instead.
    if: github.ref_type == 'branch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.build.outputs.tag }}
