[project]
name = "rostree"
version = "1.0.0"
description = "Explore ROS 2 package dependencies from the command line (CLI, TUI, library)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rostree contributors" }]
keywords = ["ros2", "ros", "dependencies", "visualization", "tui", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: Console",
]
dependencies = [
    "textual>=0.47.0",
    "rich>=13.0",
    # Reading a package.xml is the one place rostree parses XML it did not write.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
viz = [
    "networkx>=3.0",
    "matplotlib>=3.7",
]
docs = [
    # Capped at the current major: the docs build runs with `strict: true`, so a
    # theme release that renames a feature flag would turn into a red CI run on an
    # unrelated pull request. 9.x already caps `mkdocs<2` itself.
    "mkdocs-material>=9.5,<10",
]
dev = [
    "bandit[toml]==1.9.4",
    "black==25.1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.1",
]

[project.scripts]
rostree = "rostree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rostree"]

[tool.hatch.build.targets.sdist]
include = ["src/rostree"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a new ruff release cannot change what CI enforces.
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
)/
'''

[tool.bandit]
# Mirrors .codacy.yaml, so `bandit -c pyproject.toml -r src tests` locally and in
# CI reports what the Codacy gate reports. No rules are skipped globally: the
# handful of accepted findings under src/ carry an inline `# nosec <id>` with the
# reason, so a new one still has to be looked at rather than inherited.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
